name: Director de juego

# Se ejecuta cada vez que alguien abre una incidencia (issue) desde la página del juego.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Una sola ejecución a la vez, para que dos jugadas no se pisen.
concurrency:
  group: director-de-juego
  cancel-in-progress: false

jobs:
  procesar:
    # Solo incidencias con título como "[accion] ...", "[unirse] ...", etc.
    if: startsWith(github.event.issue.title, '[')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Procesar la jugada
        run: node engine/juego.cjs
        env:
          # Todo lo que viene de la incidencia entra por variables de entorno, nunca dentro del script.
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAVE_PRIVADA: ${{ secrets.CLAVE_PRIVADA }}
          MODELO: ${{ vars.MODELO }}

      - name: Guardar los cambios de la campaña
        run: |
          git config user.name "director-de-juego"
          git config user.email "director-de-juego@users.noreply.github.com"
          git add estado.json secreto.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Campaña actualizada (incidencia #${{ github.event.issue.number }})"
            git pull --rebase --autostash
            git push
          fi
